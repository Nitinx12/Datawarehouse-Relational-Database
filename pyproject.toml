[project]
name = "lrdb"
version = "0.1.0"
description = "LRDB datawarehouse ETL"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0,<3",
    "psycopg[binary]>=3.1",
    "pymongo>=4.0",
    "databricks-sql-connector>=3.0",
    "pyspark>=3.5,<3.6",
    "delta-spark>=3.0,<4",
    "python-dotenv>=1.0",
    "pyarrow>=16.1.0",
    "rich>=13.0",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "great-expectations>=1.23.2",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
    "sqlfluff>=3.0",
]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
"notebooks/*.ipynb" = ["B018", "F401"]

[tool.pytest.ini_options]
testpaths = ["tests"]
