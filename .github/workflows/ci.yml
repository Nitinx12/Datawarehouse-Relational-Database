name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UV_FROZEN: "true"

jobs:
  lint-python:
    name: Ruff lint + format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
          enable-cache: true
      - name: Sync dependencies
        run: uv sync --group dev --frozen
      - name: Ruff lint
        run: uv run ruff check main.py scripts/ tests/ dashboard/ airflow/dags/ src/
      - name: Ruff format check
        run: uv run ruff format --check main.py scripts/ tests/ dashboard/ airflow/dags/ src/

  lint-sql:
    name: SQLFluff lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
          enable-cache: true
      - name: Sync dependencies
        run: uv sync --group dev --frozen
      - name: SQLFluff lint
        run: uv run sqlfluff lint sql/ src/jobs/ tests/

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    needs: [lint-python]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
          enable-cache: true
      - name: Sync dependencies
        run: uv sync --group dev --frozen
      - name: Run unit tests
        run: uv run pytest tests/unit -q

  compose-validate:
    name: Compose config check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Seed dummy env for interpolation check
        run: cp .env.example .env
      - name: Validate docker compose config
        run: docker compose config --quiet
