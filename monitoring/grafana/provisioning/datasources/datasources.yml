apiVersion: 1
datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true

  - name: Warehouse
    uid: warehouse
    type: postgres
    access: proxy
    url: postgres:5432
    user: grafana_ro
    secureJsonData:
      password: ${GRAFANA_DB_PASSWORD}
    jsonData:
      database: datawarehouse
      sslmode: disable
      postgresVersion: 1700
